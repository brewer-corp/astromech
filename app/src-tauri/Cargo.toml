[package]
name = "astromech-app"
description = "astromech, the one app (decision astromech-6i8s): the core, its tray and the window in one Tauri v2 process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The executable keeps the core's name (decision astromech-nade): the Run key, the installer's
# `--quit`, every release's update helper and the single-instance mutex name it.
[[bin]]
name = "astromech-core"
path = "src/main.rs"

# Tauri is optional so the root workspace's checks build this as the headless app, without
# webkit2gtk on Linux. tauri.conf.json's build.features turns `window` on for tauri build/dev.
[features]
window = ["dep:tauri", "dep:tauri-build", "dep:webview2-com", "dep:windows-sys"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"], optional = true }
serde_json.workspace = true
astromech-core.workspace = true
astromech-api.workspace = true
astromech-input.workspace = true

[target.'cfg(windows)'.dependencies]
# wry's version, to handle WebView2's ProcessFailed event.
webview2-com = { version = "0.39", optional = true }
windows-sys = { workspace = true, features = ["Win32_System_LibraryLoader"], optional = true }
