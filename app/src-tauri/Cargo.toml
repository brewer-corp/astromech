[package]
name = "astromech-shell"
description = "astromech app window: Tauri v2 shell around the Svelte app (app/)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "astromech-shell"
path = "src/main.rs"

# Tauri is optional so the root workspace's checks build this crate as a stub, without
# webkit2gtk on Linux. tauri.conf.json's build.features turns `window` on for tauri build/dev.
[features]
window = ["dep:tauri", "dep:tauri-plugin-single-instance", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
serde_json.workspace = true
astromech-keybinds.workspace = true
astromech-input.workspace = true
astromech-store.workspace = true
astromech-log.workspace = true
astromech-api.workspace = true
