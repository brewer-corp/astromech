[package]
name = "astromech-shell"
description = "astromech app window: Tauri v2 shell around the Svelte app (app/)"
version = "0.1.5"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/spadaval/astromech"
publish = false

# Own workspace: Tauri needs webkit2gtk on Linux, so the root workspace (and Linux CI) skips it.
[workspace]

[[bin]]
name = "astromech-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
anyhow = "1"
astromech-keybinds = { path = "../../crates/astromech-keybinds" }
astromech-input = { path = "../../crates/astromech-input" }
astromech-materials = { path = "../../crates/astromech-materials" }
astromech-engineering = { path = "../../crates/astromech-engineering" }
astromech-ship = { path = "../../crates/astromech-ship" }
astromech-galaxy = { path = "../../crates/astromech-galaxy" }
astromech-history = { path = "../../crates/astromech-history" }
astromech-store = { path = "../../crates/astromech-store" }
astromech-powerplay = { path = "../../crates/astromech-powerplay" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
