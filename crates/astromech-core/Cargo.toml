[package]
name = "astromech-core"
description = "astromech core process: game state pipeline, binds health check, push-to-talk voice commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "astromech-core"
path = "src/main.rs"

[dependencies]
astromech-log.workspace = true
astromech-proto.workspace = true
astromech-journal.workspace = true
astromech-status.workspace = true
astromech-gamestate.workspace = true
astromech-keybinds.workspace = true
astromech-input.workspace = true
astromech-intent.workspace = true
astromech-voice.workspace = true
astromech-policy.workspace = true
astromech-tools.workspace = true
astromech-store.workspace = true
astromech-announce.workspace = true
astromech-data.workspace = true
astromech-galaxy.workspace = true
astromech-market.workspace = true
astromech-colonisation.workspace = true
astromech-eddn.workspace = true
astromech-history.workspace = true
astromech-station.workspace = true
astromech-exobiology.workspace = true
astromech-exploration.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
clap = { version = "4.6", features = ["derive"] }
notify = "8.2"
toml = "0.9"
toml_edit = "0.25"
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2.workspace = true
ureq.workspace = true
ed25519-dalek.workspace = true

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Security"] }
png = "0.18"

[dev-dependencies]
tempfile.workspace = true
astromech-data.workspace = true
astromech-materials.workspace = true
astromech-powerplay.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
