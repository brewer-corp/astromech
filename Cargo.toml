[workspace]
resolver = "3"
members = ["crates/*"]
# The Tauri shell has its own workspace (app/src-tauri): it needs webkit2gtk on Linux,
# so it is built on the Windows CI job only.
exclude = ["app/src-tauri", "spikes"]

[workspace.package]
version = "0.1.5"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/spadaval/astromech"
publish = false

[workspace.dependencies]
astromech-proto = { path = "crates/astromech-proto" }
astromech-journal = { path = "crates/astromech-journal" }
astromech-status = { path = "crates/astromech-status" }
astromech-gamestate = { path = "crates/astromech-gamestate" }
astromech-keybinds = { path = "crates/astromech-keybinds" }
astromech-input = { path = "crates/astromech-input" }
astromech-voice = { path = "crates/astromech-voice" }
astromech-policy = { path = "crates/astromech-policy" }
astromech-tools = { path = "crates/astromech-tools" }
astromech-overlay = { path = "crates/astromech-overlay" }
astromech-store = { path = "crates/astromech-store" }
astromech-intent = { path = "crates/astromech-intent" }
astromech-materials = { path = "crates/astromech-materials" }
astromech-engineering = { path = "crates/astromech-engineering" }
astromech-galaxy = { path = "crates/astromech-galaxy" }
astromech-ship = { path = "crates/astromech-ship" }
astromech-data = { path = "crates/astromech-data" }
astromech-powerplay = { path = "crates/astromech-powerplay" }
astromech-eddn = { path = "crates/astromech-eddn" }
astromech-history = { path = "crates/astromech-history" }
astromech-odyssey = { path = "crates/astromech-odyssey" }
anyhow = "1.0.104"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
roxmltree = "0.21"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
thiserror = "2"
tempfile = "3.27"
windows-sys = "0.61"
sha2 = "0.10"
ureq = "2"
ed25519-dalek = "2"

[workspace.lints.clippy]
# Seed code from the spikes uses long argument lists and wide tuples; tidy as it is refactored.
too_many_arguments = "allow"
type_complexity = "allow"
missing_safety_doc = "allow"
missing_transmute_annotations = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
