# cargo-deny config, from the S8 licence audit (docs/ARCHITECTURE.md §16.1, §17).
# The optional `sherpa` feature of astromech-voice is not checked here: its native libraries
# carry the GPL-3.0 espeak-ng caveat described in NOTICE.md.
[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = false
# tray-icon is a Windows-only dependency of astromech-core, but cargo-deny unions the target
# list per edge, so its Linux GTK backend shows up via the Linux target. It's never built.
exclude = ["gtk", "libappindicator", "muda"]

[licenses]
# Planned allowlist from ARCHITECTURE.md §16.1 (GPL-3.0 only via named exceptions).
allow = ["MIT", "MIT-0", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD", "BSL-1.0", "CC0-1.0", "Unlicense", "Unicode-3.0", "MPL-2.0", "CDLA-Permissive-2.0"]
confidence-threshold = 0.8
unused-allowed-license = "allow"
exceptions = [
  # egui's bundled fonts (Hack, Noto Emoji, Ubuntu-Light): font licences, not code.
  { allow = ["OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
]

[advisories]
ignore = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
