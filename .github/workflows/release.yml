name: Release build

# docs/V1-DESIGN.md §7.8. Builds the per-user NSIS installer (unsigned, §7.4) on Windows,
# installs it silently on the runner and smoke-tests it. PRs that touch packaging (the paths
# below) and manual runs upload the
# installer as a workflow artifact; a `v*` tag also publishes a GitHub Release (body: docs/releases/<tag>.md; SHA-256s as
# an asset) and a signed zip (`latest.json` + `.sig`) for in-app updates (§7.3).
# The version comes from the tag: the repository says 0.0.0-dev, and scripts/set-version.py
# stamps the tag's version before anything builds (PR and manual builds stay 0.0.0-dev).
# Signing key: repo secret ASTROMECH_UPDATE_KEY (32-byte ed25519 seed hex). Public key is
# crates/astromech-core/src/update.rs PUBLIC_KEY_HEX.

on:
  push:
    tags: ["v*"]
  # Everything else a PR can break here (frontend sources, tests) is built by CI's Windows
  # job; this adds the release packaging, so PRs run it when anything that ships in, builds,
  # or starts the installed app changes. `paths` and `paths-ignore` cannot be combined, so
  # the test and fixture exclusions are `!` patterns; .md files that the installer bundles
  # are listed explicitly so they still trigger.
  pull_request:
    paths:
      - .github/workflows/release.yml
      # Workspace build configuration
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/config.toml
      - deny.toml
      # Core, voice worker and every linked crate (including include_str! files and sample config)
      - crates/**
      - "!crates/**/tests/**"
      - "!crates/**/examples/**"
      - data/catalog/**
      # The app (app/src-tauri) and the frontend build configuration (app/src/** is built by CI)
      - app/src-tauri/**
      - app/package.json
      - app/pnpm-lock.yaml
      - app/vite.config.ts
      - app/svelte.config.js
      - app/tsconfig*.json
      - app/index.html
      - app/public/**
      # Files bundled into the NSIS installer
      - NOTICE.md
      - THIRD_PARTY.md
      - LICENSE
      - COPYING-GPL-3.0.txt
      - scripts/stage-sidecars.sh
      - scripts/set-version.py
      - scripts/pack-update.py
      - scripts/gen-starmap.py
      - scripts/onboarding_smoke.py
      - scripts/one_process_probe.py
      - scripts/upgrade_smoke.py
      # What the onboarding smoke test drives: the wizard, the voice tester and the window's half
      # of its one command, `call`, which every page it opens calls through (the mock game,
      # crates/astromech-mockgame, is under crates/**)
      - app/src/lib/onboarding/**
      - app/src/modules/voicetester/**
      - app/src/App.svelte
      - app/src/lib/transport.ts
      - app/src/lib/core.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  installer:
    name: Windows installer (build, install, smoke test)
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python scripts/set-version.py "$GITHUB_REF_NAME"
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      # One invocation, so Cargo builds them in parallel and shares their dependencies. The mock
      # game is for the onboarding smoke test and sign-update signs latest.json; neither ships.
      # astromech-shell.exe is the forwarder old shortcuts and pins start (decision
      # astromech-nade); it ships through externalBin. The app itself (astromech-core.exe: the
      # core, the tray and the window) is built by tauri build below. The voice worker stays
      # separate: built together, Cargo would unify astromech-voice's features and link the GPL
      # sherpa build into the app too.
      - name: mock game, sign-update and the astromech-shell.exe forwarder (release)
        run: cargo build --release --locked -p astromech-core --bin sign-update -p astromech-mockgame --bin mockgame -p astromech-shell --bin astromech-shell
      - name: drop a sherpa-onnx prebuilt cache that lost its libraries
        # sherpa-onnx-sys skips its download when target/sherpa-onnx-prebuilt/<ver>/lib exists,
        # and rust-cache can restore that folder without the static libraries in it.
        shell: bash
        run: |
          d=target/sherpa-onnx-prebuilt
          if [ -d "$d" ] && ! compgen -G "$d/*/lib/*sherpa-onnx-c-api*" > /dev/null; then
            echo "removing $d (no sherpa-onnx-c-api library inside)"
            rm -rf "$d"
          fi
      - name: voice worker (release, sherpa-onnx; GPL-3.0 binary, see NOTICE.md)
        run: cargo build -p astromech-voice --features sherpa --bin astromech-voice-worker --release --locked
      - name: stage the voice worker and the forwarder (externalBin)
        shell: bash
        run: scripts/stage-sidecars.sh target/release
      - name: star map preload (published separately by starmap.yml; placeholder on PRs)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out=app/src-tauri/resources/starmap.db
          mkdir -p "$(dirname "$out")"
          if [[ "$GITHUB_REF" == refs/tags/* ]] && gh release download starmap --repo "$GITHUB_REPOSITORY" --pattern starmap.db.gz --dir "$RUNNER_TEMP"; then
            gzip -dc "$RUNNER_TEMP/starmap.db.gz" > "$out"
            echo "star map preload: $(du -h "$out" | cut -f1)"
          else
            [[ "$GITHUB_REF" == refs/tags/* ]] && echo "::warning::No starmap release found; shipping without a star map preload (the app fills in from EDSM)."
            python scripts/gen-starmap.py --empty --out "$out"
          fi
      - name: frontend install
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: tauri build (NSIS, per-user)
        working-directory: app
        run: pnpm tauri build --ci -- --locked
      - name: collect installer + SHA-256
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          cp target/release/bundle/nsis/*-setup.exe dist-release/
          cp NOTICE.md LICENSE COPYING-GPL-3.0.txt dist-release/
          cd dist-release
          sha256sum *-setup.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "installer=$(ls *-setup.exe)" >> "$GITHUB_OUTPUT"
      - name: pack update zip + latest.json
        env:
          ASTROMECH_UPDATE_KEY: ${{ secrets.ASTROMECH_UPDATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          # One workspace: the app, the forwarder and the voice worker are all in target/release.
          REL=target/release
          files=()
          # astromech-shell.exe: the forwarder. The updater never deletes, so an updated two-process
          # install keeps its old astromech-shell.exe (the old window) unless the zip replaces it.
          for f in astromech-core.exe astromech-voice-worker.exe astromech-shell.exe; do
            [ -f "$REL/$f" ] || { echo "missing $REL/$f" >&2; exit 1; }
          done
          for f in astromech-core.exe astromech-voice-worker.exe astromech-shell.exe \
                   NOTICE.md COPYING-GPL-3.0.txt THIRD_PARTY.md LICENSE.txt LICENSE; do
            if [ -f "$REL/$f" ]; then files+=("$REL/$f"); fi
          done
          # The installer ships it as a Tauri resource; updates must carry it too.
          files+=(app/src-tauri/resources/starmap.db)
          python3 scripts/pack-update.py --out dist-release --notes "See the GitHub release notes." "${files[@]}"
          if [ -n "${ASTROMECH_UPDATE_KEY:-}" ]; then
            target/release/sign-update.exe dist-release/latest.json
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "ASTROMECH_UPDATE_KEY is required to publish a signed update on a tag" >&2
            exit 1
          else
            echo "no ASTROMECH_UPDATE_KEY; latest.json is unsigned (PR artifact only)"
          fi
      - name: smoke test (silent per-user install, start, status, quit, uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-ChildItem dist-release/*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $dirs = @("$env:LOCALAPPDATA\astromech", "$env:LOCALAPPDATA\Programs\astromech")
          $inst = $dirs | Where-Object { Test-Path "$_\astromech-core.exe" } | Select-Object -First 1
          if (-not $inst) { Get-ChildItem $env:LOCALAPPDATA -Recurse -Filter astromech-core.exe -ErrorAction SilentlyContinue | Select-Object FullName; throw "astromech-core.exe not installed" }
          Write-Host "installed to $inst"
          foreach ($f in "astromech-core.exe","astromech-shell.exe","astromech-voice-worker.exe","NOTICE.md","COPYING-GPL-3.0.txt") {
            if (-not (Test-Path "$inst\$f")) { throw "missing $f" }
          }
          $v = (& "$inst\astromech-core.exe" --version | Out-String).Trim()
          Write-Host "core: $v"
          if ($v -notmatch "^astromech-core \d+\.\d+\.\d+") { throw "no version from the core" }
          Start-Process "$inst\astromech-core.exe" -ArgumentList "--background"
          $ep = "$env:LOCALAPPDATA\astromech\data\core.json"
          for ($i = 0; $i -lt 40 -and -not (Test-Path $ep); $i++) { Start-Sleep -Milliseconds 250 }
          if (-not (Test-Path $ep)) { Get-Content "$env:LOCALAPPDATA\astromech\data\logs\*.log" -ErrorAction SilentlyContinue; throw "core didn't publish its control endpoint" }
          $e = Get-Content $ep | ConvertFrom-Json
          $c = [System.Net.Sockets.TcpClient]::new("127.0.0.1", $e.port)
          $s = $c.GetStream(); $w = [IO.StreamWriter]::new($s); $r = [IO.StreamReader]::new($s)
          $w.WriteLine((@{ token = $e.token; cmd = "status" } | ConvertTo-Json -Compress)); $w.Flush()
          $status = $r.ReadLine() | ConvertFrom-Json; $c.Close()
          if (-not $status.ok) { throw "status not ok: $($status.error)" }
          Write-Host "status: $($status.value.status_line)"
          if (-not $status.value.status_line) { throw "status has no status_line" }
          # --background (the Run value) is the one app with no window: one astromech-core
          # process, no astromech-shell, and no WebView2 process of the app's, matched by descent
          # and by command line (its --webview-exe-name, or its EBWebView folder) as
          # scripts/one_process_probe.py does.
          Start-Sleep -Seconds 3
          $cores = @(Get-Process astromech-core -ErrorAction SilentlyContinue)
          if ($cores.Count -ne 1) { throw "expected one astromech-core process, found $($cores.Count)" }
          if (Get-Process astromech-shell -ErrorAction SilentlyContinue) { throw "an astromech-shell process is running" }
          $all = @(Get-CimInstance Win32_Process)
          $tree = @{}; $todo = [System.Collections.Generic.Queue[uint32]]::new(); $todo.Enqueue([uint32]$cores[0].Id)
          while ($todo.Count) {
            $p = $todo.Dequeue()
            foreach ($c in $all) { if ($c.ParentProcessId -eq $p -and -not $tree.ContainsKey($c.ProcessId)) { $tree[$c.ProcessId] = $true; $todo.Enqueue($c.ProcessId) } }
          }
          $ebw = "$env:LOCALAPPDATA\io.github.spadaval.astromech\EBWebView".ToLower()
          $wv = @($all | Where-Object { $_.Name -eq "msedgewebview2.exe" -and ($tree.ContainsKey($_.ProcessId) -or "$($_.CommandLine)".ToLower().Contains("--webview-exe-name=astromech-core.exe") -or "$($_.CommandLine)".ToLower().Contains($ebw)) })
          if ($wv.Count) { $wv | Format-List ProcessId, ParentProcessId, CommandLine | Out-String -Width 400 | Write-Host; throw "$($wv.Count) WebView2 process(es) belong to the app started --background" }
          Write-Host "--background: one astromech-core ($($cores[0].Id)), no astromech-shell, no WebView2 of the app's ($($all.Count) processes looked at)"
          # A second start must not run a second core.
          Start-Process "$inst\astromech-core.exe" -ArgumentList "--background" -Wait
          if ((Get-Process astromech-core -ErrorAction SilentlyContinue).Count -ne 1) { throw "single instance failed" }
          $run = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name astromech -ErrorAction SilentlyContinue
          Write-Host "autostart: $($run.astromech)"
          if (-not $run) { throw "start with Windows wasn't turned on by default" }
          if ($run.astromech -ne "`"$inst\astromech-core.exe`" --background") { throw "the Run value isn't `"$inst\astromech-core.exe`" --background" }
          & "$inst\astromech-core.exe" --quit
          Start-Sleep -Seconds 2
          if (Get-Process astromech-core -ErrorAction SilentlyContinue) { throw "core didn't quit" }
          Get-Content "$env:LOCALAPPDATA\astromech\data\logs\astromech-core.log"
          if (-not (Select-String -Path "$env:LOCALAPPDATA\astromech\data\logs\astromech-core.log" -SimpleMatch "quitting" -Quiet)) { throw "--quit didn't log 'quitting'" }
          Start-Process "$inst\uninstall.exe" -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 3
          if (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name astromech -ErrorAction SilentlyContinue) { throw "uninstall left the Run value" }
          Write-Host "smoke test OK"
      - uses: actions/upload-artifact@v4
        with:
          name: astromech-installer-windows-x64
          path: dist-release/
          if-no-files-found: error
      - name: onboarding smoke test (fresh install, wizard, verified gear-down vs the mock game)
        shell: pwsh
        run: |
          python -m pip install --quiet websocket-client
          $setup = Get-ChildItem dist-release/*-setup.exe | Select-Object -First 1
          python scripts/onboarding_smoke.py --setup $setup.FullName --mock target/release/mockgame.exe --out onboarding-report
          if ($LASTEXITCODE -ne 0) { throw "onboarding smoke test failed" }
      - name: onboarding report
        if: always()
        shell: bash
        run: |
          if [ -f onboarding-report/report.md ]; then cat onboarding-report/report.md >> "$GITHUB_STEP_SUMMARY"; fi
          for f in "$LOCALAPPDATA"/astromech/data/logs/*.log; do [ -f "$f" ] && cp "$f" onboarding-report/ ; done; true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onboarding-smoke-report
          path: onboarding-report/
          if-no-files-found: warn
      # Spike astromech-wgtr's probe against the installed app: windowless with the tray, a second
      # start opening the window, five closes freeing WebView2, the window's renderer and browser
      # process killed (the window must recover in place: a reload, a rebuild), and quit. Raw Input
      # (check 2) is the onboarding smoke's kill-switch runs. A second start's page must load within
      # 30 s: the first WebView2 start on a runner has taken 13 s (the 2 s cold-start budget is App
      # window cost's); each load's time is in the report.
      - name: one-process probe (installed app)
        shell: pwsh
        run: |
          python -m pip install --quiet "psutil>=5.9,<8" "pillow>=10,<12"
          $setup = Get-ChildItem dist-release/*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $inst = @("$env:LOCALAPPDATA\astromech", "$env:LOCALAPPDATA\Programs\astromech") | Where-Object { Test-Path "$_\astromech-core.exe" } | Select-Object -First 1
          if (-not $inst) { throw "astromech-core.exe not installed" }
          $data = "$env:LOCALAPPDATA\astromech\data"
          python scripts/one_process_probe.py --app "$inst\astromech-core.exe" --endpoint "$data\core.json" `
            --log "$data\logs\astromech-core.log" --user-data "$env:LOCALAPPDATA\io.github.spadaval.astromech\EBWebView" `
            --title astromech --no-sink --no-churn --expect-recovery --page-load-s 30 --start-args= --before-build-args= --baseline-args= `
            --out one-process-report
          $code = $LASTEXITCODE
          Start-Process "$inst\uninstall.exe" -ArgumentList "/S" -Wait
          if ($code -ne 0) { throw "one-process probe failed" }
      - name: one-process report
        if: always()
        shell: bash
        run: |
          if [ -f one-process-report/report.md ]; then cat one-process-report/report.md >> "$GITHUB_STEP_SUMMARY"; fi
          cp "$LOCALAPPDATA/astromech/data/logs/astromech-core.log" one-process-report/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: one-process-app-probe
          path: one-process-report/
          if-no-files-found: warn

  # An existing two-process install upgraded to this build by both routes a player has: the old
  # release's own update helper overlaying this build's zip, and this build's setup.exe /S over
  # the running install (astromech-9lh3; scripts/upgrade_smoke.py). The old release is pinned to
  # v1.0.0-alpha.4, the last two-process release: the script starts the old core and the old
  # window (astromech-shell.exe), which a one-process release doesn't have, so "the newest v*"
  # would break every release after the first one-process one. Upgrades between one-process
  # releases are another test (astromech-7pl5).
  upgrade:
    name: Upgrade from the last two-process release (updater and installer)
    needs: installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          name: astromech-installer-windows-x64
          path: dist-release
      - name: the last two-process release's installer (v1.0.0-alpha.4)
        id: old
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v1.0.0-alpha.4
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*-setup.exe' --dir old-release
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "setup=$(ls old-release/*-setup.exe | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "version=$(python -c "import json; print(json.load(open('dist-release/latest.json'))['version'])")" >> "$GITHUB_OUTPUT"
          echo "zip=$(ls dist-release/*-windows-x64.zip | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "setup_new=$(ls dist-release/*-setup.exe | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "upgrading from $tag to $(cat dist-release/latest.json)"
      - name: upgrade smoke test (updater route, then installer route)
        shell: pwsh
        run: |
          python -m pip install --quiet "psutil>=5.9,<8"
          python scripts/upgrade_smoke.py --old-setup "${{ steps.old.outputs.setup }}" --old "${{ steps.old.outputs.tag }}" `
            --setup "${{ steps.old.outputs.setup_new }}" --zip "${{ steps.old.outputs.zip }}" `
            --version "${{ steps.old.outputs.version }}" --out upgrade-report
          if ($LASTEXITCODE -ne 0) { throw "upgrade smoke test failed" }
      - name: upgrade report
        if: always()
        shell: bash
        run: |
          if [ -f upgrade-report/report.md ]; then cat upgrade-report/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-smoke-report
          path: upgrade-report/
          if-no-files-found: warn

  publish:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    # Not before the upgrade test: a release that two-process installs can't upgrade to stays
    # unpublished.
    needs: [installer, upgrade]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Before the download: checkout empties a workspace that is not a git clone.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/releases
      - uses: actions/download-artifact@v4
        with:
          name: astromech-installer-windows-x64
          path: dist-release
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release body is docs/releases/<tag>.md, as written. A tag with no notes file fails here.
          notes="docs/releases/$GITHUB_REF_NAME.md"
          [ -f "$notes" ] || { echo "::error::missing $notes: write the release notes before tagging"; exit 1; }
          if grep -q '<!-- pending' "$notes"; then echo "::error::$notes still has pending markers"; exit 1; fi
          gh release create "$GITHUB_REF_NAME" dist-release/* --repo "$GITHUB_REPOSITORY" --title "astromech $GITHUB_REF_NAME" --notes-file "$notes"
