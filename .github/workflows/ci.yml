name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".atelier/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".atelier/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: Linux (fmt, clippy, tests, deny, deps, frontend)
    # Pinned: ubuntu-latest is 26.04, where Playwright 1.60 installs no Chromium.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: guide links
        run: python3 scripts/check-guide.py
      # rust-toolchain.toml pins the version and components; rustup installs it on first use.
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: tests
        run: cargo test --workspace --locked
      - name: dependency rules
        run: python3 scripts/check-deps.py
      - name: MVP criteria harness (analysis tests)
        run: python3 scripts/test_mvp_criteria.py
      - name: neutron star file builder
        run: python3 scripts/test_gen_neutron.py
      - name: EDDN module list check
        run: python3 scripts/test_gen_eddn_outfitting.py
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo-deny
        run: cargo deny check
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: frontend install
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: frontend lint
        working-directory: app
        run: pnpm lint
      - name: frontend typecheck
        working-directory: app
        run: pnpm check
      - name: journeys typecheck
        working-directory: app
        run: pnpm exec tsc -p journeys
      - name: frontend build
        working-directory: app
        run: pnpm build
      - name: release build carries no browser preview
        run: python3 scripts/check-dist.py app/dist
      # The UI tests run in headless Chromium (app/vite.config.ts, project "browser"); the cache
      # keeps the download, and the install still adds the system libraries it needs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
      - name: Playwright Chromium
        working-directory: app
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: frontend tests (node and browser projects)
        working-directory: app
        run: pnpm test
      # The dev bridge (app/dev/bridge.ts) on worlds/minimal, with the core `cargo test` built.
      - name: dev bridge answers with the real core
        working-directory: app
        run: pnpm bridge-check
      # The journeys (app/journeys/, CONTRIBUTING.md Tests): the page in Playwright's Chromium on
      # the dev server, against the core `cargo test` built, each on its committed world. The `ls`
      # fails a glob that matches nothing, which `node --test` would pass as a run of none.
      - name: journeys
        working-directory: app
        timeout-minutes: 5
        run: |
          ls journeys/*.journey.ts
          node --test 'journeys/*.journey.ts'
      - name: journey results (trace, screenshot, core log)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journeys
          path: app/journeys/results/
          if-no-files-found: ignore

  windows:
    name: Windows (MSVC build + tests, app shell)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: clippy (Windows-only code paths)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: build
        run: cargo build --workspace --locked
      - name: tests
        run: cargo test --workspace --locked
      - name: gear-down end-to-end vs the mock game window (best effort; SendInput needs a desktop session)
        continue-on-error: true
        shell: bash
        env:
          RUN: ""
          TARGET_DIR: target/debug
        run: |
          cargo build -p astromech-core --bin astromech-core -p astromech-mockgame --bin mockgame --locked
          scripts/e2e-gear-down.sh
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: frontend build (for the shell)
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: stage the core next to the shell (externalBin)
        shell: bash
        env:
          PLACEHOLDER: "1"
        run: scripts/stage-sidecars.sh target/debug
      - name: star map placeholder (releases download the published preload)
        shell: bash
        run: python scripts/gen-starmap.py --empty --out app/src-tauri/resources/starmap.db
      # The workspace steps above build the window as a stub; this builds the real one.
      - name: app shell (Tauri) build
        run: cargo build -p astromech-shell --features window --locked
      - name: app shell clippy
        run: cargo clippy -p astromech-shell --features window --all-targets --locked -- -D warnings
