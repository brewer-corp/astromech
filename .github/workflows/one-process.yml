name: One process (Windows)

# Spike O1 (Atelier astromech-wgtr): can one Tauri process hold the tray with no window, survive
# the window crashing, free WebView2 when the window closes and keep astromech's Raw Input
# listener receiving keys? `probe` gates on those checks and reports cost; `restart` reports
# which crashes Windows' restart registration restarts. Reports: the job summaries and the
# one-process-* artifacts.

on:
  pull_request:
    paths:
      - .github/workflows/one-process.yml
      - scripts/one_process_probe.py
      - spikes/o1-one-process/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-process-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/o1-one-process
          key: one-process
      - name: spike (release)
        working-directory: spikes/o1-one-process
        run: cargo build --release --locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: probe
        shell: bash
        run: |
          python -m pip install --quiet "psutil>=5.9,<8" "pillow>=10,<12"
          python scripts/one_process_probe.py \
            --app spikes/o1-one-process/target/release/astromech-spike.exe \
            --endpoint "$LOCALAPPDATA/astromech-spike/core.json" \
            --out one-process-report
      - name: report
        if: always()
        shell: bash
        run: |
          if [ -f one-process-report/report.md ]; then cat one-process-report/report.md >> "$GITHUB_STEP_SUMMARY"; fi
          cp "$LOCALAPPDATA/astromech-spike/spike.log" one-process-report/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: one-process-probe
          path: one-process-report/
          if-no-files-found: warn

  restart:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/o1-one-process
          key: one-process
      - name: spike (release)
        working-directory: spikes/o1-one-process
        run: cargo build --release --locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: restart registration, WER as the runner has it (reported, not gated)
        shell: bash
        run: |
          python -m pip install --quiet "psutil>=5.9,<8" "pillow>=10,<12"
          python scripts/one_process_probe.py --restart --config "runner WER" \
            --app spikes/o1-one-process/target/release/astromech-spike.exe \
            --endpoint "$LOCALAPPDATA/astromech-spike/core.json" \
            --out one-process-restart
      # A desktop's defaults: WerSvc is a manual (trigger-start) service, and WER is neither
      # disabled nor silenced by registry or policy. The runner sets DontShowUI=1 and leaves the
      # service stopped.
      - name: turn WER on as a Windows 10/11 desktop has it
        if: always()
        shell: pwsh
        run: |
          Set-Service WerSvc -StartupType Manual
          Start-Service WerSvc
          foreach ($hive in 'HKLM:', 'HKCU:') {
            $k = "$hive\SOFTWARE\Microsoft\Windows\Windows Error Reporting"
            if (Test-Path $k) {
              foreach ($v in 'Disabled', 'DontShowUI', 'LoggingDisabled', 'Consent') {
                Remove-ItemProperty -Path $k -Name $v -ErrorAction SilentlyContinue
              }
            }
            $pol = "$hive\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting"
            if (Test-Path $pol) { Remove-Item $pol -Recurse -Force }
          }
          Get-Service WerSvc | Format-List Name, Status, StartType
      # Two runs with WER on: launched as the runner launches (its error mode and job inherited),
      # then as Explorer or Start with Windows would (default error mode, out of the job).
      - name: restart registration, WER on (reported, not gated)
        if: always()
        shell: bash
        run: |
          python scripts/one_process_probe.py --restart --config "WER on" \
            --app spikes/o1-one-process/target/release/astromech-spike.exe \
            --endpoint "$LOCALAPPDATA/astromech-spike/core.json" \
            --out one-process-restart
      - name: restart registration, WER on, clean launch (reported, not gated)
        if: always()
        shell: bash
        run: |
          python scripts/one_process_probe.py --restart --config "WER on, clean launch" --clean-launch \
            --app spikes/o1-one-process/target/release/astromech-spike.exe \
            --endpoint "$LOCALAPPDATA/astromech-spike/core.json" \
            --out one-process-restart
      - name: report
        if: always()
        shell: bash
        run: |
          if [ -f one-process-restart/restart.md ]; then cat one-process-restart/restart.md >> "$GITHUB_STEP_SUMMARY"; fi
          cp "$LOCALAPPDATA/astromech-spike/spike.log" one-process-restart/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: one-process-restart
          path: one-process-restart/
          if-no-files-found: warn
