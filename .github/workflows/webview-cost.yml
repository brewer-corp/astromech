name: App window cost

# The one app as a player uses it, measured by scripts/webview_cost.py: astromech-core is one
# process holding the core, the tray and, when asked, the window (decision astromech-6i8s), plus
# its speech worker. It runs the app windowless (--background), opens the window by a second
# start, closes it again over 5 cycles, kills the window's renderer and browser process, and
# quits. It fails if a WebView2 process belongs to the app windowless or outlives a close by
# 15 s, if the app dies with its window, if a crashed window doesn't recover and close, if a page
# change misses the window, if cold start takes 2 s or more, or if idle CPU is over 1% of the
# machine (S11, docs/ARCHITECTURE.md §18.1). Memory is reported, not bounded (decision
# astromech-01ft). This shows success criterion one-process (mission astromech-kjfs).
# Windows (WebView2) gates; Linux (WebKitGTK) reports only, and has no closes or crashes.
# Runs on PRs that change the app, its Tauri package, the app's startup, tray and command line
# or the harness, and on demand (Actions → App window cost → Run workflow). Frame-time impact
# next to Elite needs the game (astromech-7ck3). Reports: the job summaries and the
# webview-cost-* artifacts.

on:
  pull_request:
    paths:
      - .github/workflows/webview-cost.yml
      - scripts/webview_cost.py
      - scripts/test_webview_cost.py
      # The one app's startup, tray and command line, which the Tauri host runs.
      - crates/astromech-core/src/app.rs
      - crates/astromech-core/src/tray.rs
      - crates/astromech-core/src/cli.rs
      # The window's dependencies are locked in the root workspace's files.
      - Cargo.toml
      - Cargo.lock
      - app/src-tauri/**
      - app/src/**
      - app/index.html
      - app/package.json
      - app/pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webview-cost-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  measure:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: WebKitGTK (Linux)
            os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            exe: ""
            artifact: webview-cost-linux
            # The gates are for WebView2 (the product is Windows-only): Linux reports, doesn't gate.
            gate: false
          - name: WebView2 (Windows)
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            exe: .exe
            artifact: webview-cost-windows
            gate: true
    steps:
      - uses: actions/checkout@v4
      - name: WebKitGTK and a headless display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb dbus-x11
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: webview-cost
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: voice worker and shell forwarder placeholders (externalBin; neither runs here) and an empty star map
        shell: bash
        run: |
          mkdir -p app/src-tauri/binaries
          : > app/src-tauri/binaries/astromech-voice-worker-${{ matrix.triple }}${{ matrix.exe }}
          : > app/src-tauri/binaries/astromech-shell-${{ matrix.triple }}${{ matrix.exe }}
          python3 scripts/gen-starmap.py --empty --out app/src-tauri/resources/starmap.db || python scripts/gen-starmap.py --empty --out app/src-tauri/resources/starmap.db
      - name: the app (release, no installer)
        working-directory: app
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --ci --no-bundle -- --locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: harness tests
        shell: bash
        run: |
          python -m pip install --quiet "psutil>=5.9,<8"
          python scripts/test_webview_cost.py
      - name: measure
        continue-on-error: ${{ !matrix.gate }}
        shell: bash
        run: |
          app=target/release/astromech-core${{ matrix.exe }}
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a dbus-run-session -- python scripts/webview_cost.py --app "$app" --out webview-report
          else
            python scripts/webview_cost.py --app "$app" --out webview-report
          fi
      - name: report
        if: always()
        shell: bash
        run: if [ -f webview-report/report.md ]; then cat webview-report/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: webview-report/
          if-no-files-found: warn
