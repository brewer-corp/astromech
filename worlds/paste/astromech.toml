# The paste button (crates/astromech-core/tests/world_voice.rs): in the galaxy map (GuiFocus 6) the
# paste button (Joy_12 on the left stick) sends Ctrl+V, then Enter. The modifier gap and the paste
# settle are real pacing waits on the paste's own thread, so the keys are awaited, not stepped.
# Then the map closes, and a press sends nothing.
[controls]
ptt = { device = "231D3201", key = "Joy_4" }
kill_switch = { device = "231D0200", key = "Joy_1" }
paste = { device = "231D3201", key = "Joy_12" }
