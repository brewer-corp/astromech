[package]
name = "q1-linked-places"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Spike Q1 (astromech-yn6y): two linked-place recipes run end to end against Spansh and Ardent"
publish = false

# Standalone, like the other spikes: not a workspace member, not built by CI.
[workspace]

[dependencies]
astromech-data = { path = "../../crates/astromech-data" }
anyhow = "1.0.104"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
