[package]
name = "o1-one-process"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Spike O1 (astromech-wgtr): a windowless Tauri tray app on Windows; its probe script was removed with crash restart (astromech-lkwj)"
publish = false

[[bin]]
name = "astromech-spike"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }  # the workspace lock's

[dependencies]
serde_json = "1.0.151"

# Windows only: the spike's questions are about Windows, and leaving Tauri out elsewhere keeps
# a Linux `cargo check` free of webkit2gtk.
[target.'cfg(windows)'.dependencies]
# Pinned to the workspace's Tauri (Cargo.lock), so the answers hold for the app.
tauri = { version = "=2.12.3", features = ["tray-icon", "custom-protocol"] }
# The version wry 0.57 uses: only to observe WebView2's ProcessFailed event, not to act on it.
webview2-com = "=0.39.1"
# The core's tray crate today (crates/astromech-core), for the --plain-tray baseline.
tray-icon = "0.26"
astromech-input = { path = "../../crates/astromech-input" }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Recovery",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

# The shipped app's release profile (the root Cargo.toml), so memory is measured on the same build.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
