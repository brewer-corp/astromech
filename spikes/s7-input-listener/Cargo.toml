[package]
name = "s7-input-listener"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Spike S7: listen read-only to all controller, keyboard and mouse input in the background and report what was seen while Elite Dangerous had focus"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6", features = ["derive"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_XboxController",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
