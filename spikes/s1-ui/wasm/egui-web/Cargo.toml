[package]
name = "egui-web"
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hud-model = { path = "../../hud-model" }
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "=0.36.2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }
web-time = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
