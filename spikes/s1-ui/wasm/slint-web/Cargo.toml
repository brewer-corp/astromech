[package]
name = "slint-web"
edition = "2024"
version = "0.1.0"
license = "MIT"
build = "build.rs"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hud-model = { path = "../../hud-model" }
slint = { version = "~1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg"] }
wasm-bindgen = "0.2"
web-time = "1"

[build-dependencies]
slint-build = "~1.18.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
