[package]
name = "s9-gpu-probe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Times the two heavy ONNX graphs (Parakeet encoder, Kokoro) on the CPU and on DirectML,
# using Microsoft's official onnxruntime.dll (DirectML build) loaded at run time from a
# full path. Nothing is linked at build time, so this exe can never fail with a
# "DLL not found" loader error; a missing or broken runtime is reported as a result.
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-24", "directml"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[target.'cfg(not(windows))'.dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-24"] }
