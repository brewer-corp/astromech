[package]
name = "helm-app"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "S8 licence-audit skeleton: depends on the planned key crates, contains no code"

[dependencies]
tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
notify = "8.2"
notify-debouncer-full = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
ed-journals = "0.13"
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
governor = "0.10"
oauth2 = "5"
keyring = "4"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
toml = "1"
directories = "6"
cpal = "0.18"
rubato = "5"
ringbuf = "0.5"
sherpa-onnx = "1.13.8"
hound = "3.5"
schemars = "1.2"
jsonschema = "0.58"
strsim = "0.11"
nucleo-matcher = "0.3"
minijinja = "2.24"
wgpu = "30"
winit = "0.30"
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts"] }
egui-wgpu = "0.36"
axum = { version = "0.8", features = ["ws"] }
rust-embed = "8.13"
tray-icon = "0.26"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
anyhow = "1"
arc-swap = "1.9"
sha2 = "0.11"
tempfile = "3.27"
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Devices_HumanInterfaceDevice", "Win32_Security", "Win32_System_Threading", "Media_Ocr", "Graphics_Imaging"] }
windows-sys = "0.61"
windows-capture = "2"
ocrs = "0.13"

# Phase-gated / optional pieces, kept as optional so the audit can be run with and without them.
openvr = { version = "0.9", optional = true }
openvr_sys = { version = "2.1", optional = true }
zeromq = { version = "0.6", optional = true }
tokio-tungstenite = { version = "0.30", optional = true }
slint = { version = "1.18", optional = true }
sdl3 = { version = "0.20", optional = true }

[features]
vr = ["dep:openvr", "dep:openvr_sys"]
eddn = ["dep:zeromq"]
cloud-voice = ["dep:tokio-tungstenite"]
ui-slint = ["dep:slint"]
sdl-fallback = ["dep:sdl3"]
